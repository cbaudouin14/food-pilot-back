services:
  api:
    build: .
    container_name: foodpilot-api
    command: npm run dev
    ports: 
      - "3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      DATABASE_URL: postgres://foodpilot_user:secret@db:5432/foodpilot
    depends_on:
      - db
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: foodpilot_user
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: foodpilot
    ports: 
      - "5432:5432"
    volumes: 
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
  node_modules:
